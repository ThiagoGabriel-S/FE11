<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Semânticas com Scope e o Box Model Padrão (Content-Box)</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            padding: 20px;
            background: #f8fafc
        }

        table {
            width: 100%;
            max-width: 500px;
            border-collapse: collapse;
            background: #fff;
            margin-bottom: 24px
        }

        caption {
            text-align: left;
            font-weight: bold;
            padding: 10px;
            color: #0369a1;
            background: #e0f2fe
        }

        th,
        td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: left
        }

        thead th {
            background: #0369a1;
            color: #fff
        }

        .caixa-contentbox {
            box-sizing: content-box;
            width: 250px;
            height: 60px;
            padding: 0 50px;
            border: 1px solid #b91c1c;
            background: #fee2e2;
            color: #991b1b;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center
        }
    </style>
</head>

<body>
    <table>
        <caption>Boletim de Avaliação — Módulo Front-End</caption>
        <thead>
            <tr>
                <th scope="col">Estudante</th>
                <th scope="col">HTML</th>
                <th scope="col">CSS</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Silva</td>
                <td>9.5</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>João Pereira</td>
                <td>7.0</td>
                <td>9.0</td>
            </tr>
        </tbody>
    </table>
    <div class="caixa-contentbox">
        width: 250px + padding: 0 50px + border: 1px = 352px reais
    </div>
</body>

</html>
