<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrutura do Documento, Void Elements e Semântica HTML5</title>
  <style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f8fafc;color:#0f172a}header{background:#0284c7;color:#fff;padding:16px;border-radius:8px}main{margin:20px 0}article{background:#fff;border:1px solid #cbd5e1;padding:18px;border-radius:8px;margin-bottom:16px}article img{width:100%;max-width:400px;border-radius:6px;display:block;margin-top:10px}section{background:#f1f5f9;border:1px solid #cbd5e1;padding:16px;border-radius:8px}label{display:block;margin-bottom:6px;font-weight:bold}input{padding:8px 12px;border:1px solid #94a3b8;border-radius:4px;width:100%;max-width:320px}footer{background:#0f172a;color:#94a3b8;text-align:center;padding:12px;border-radius:8px}
  </style>
</head>
<body>
<header>
    <h1>Portal de Notícias 2026</h1>
  </header>

  <main>
    <article>
      <h2>Lançamento da Web Semântica</h2>
      <p>Artigo distribuível fora desta página (ex.: em leitores de RSS ou feeds).</p>
      <img src="https://picsum.photos/id/180/400/200" alt="Computador em uma mesa">
    </article>

    <section>
      <h3>Filtros do Portal</h3>
      <label for="campo-busca">Buscar notícias:</label>
      <input type="text" id="campo-busca" placeholder="Digite aqui...">
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Estrutura Semântica Válida</p>
  </footer>
</body>
</html>
